<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="JMbiji —— 端到端加密笔记本,多端云同步">
  <meta name="theme-color" content="#2563eb">
  <title>JMbiji · 加密笔记本</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 锁屏 / 建库 -->
  <div id="lock" class="lock">
    <div class="lock-card">
      <div class="lock-brand">
        <img src="icon.svg" alt="" width="44" height="44">
        <div>
          <h1>JMbiji</h1>
          <p>加密笔记本 · 端到端加密 · 多端同步</p>
        </div>
      </div>

      <div id="lockForm">
        <div class="field" id="pwConfirmField" hidden>
          <input type="password" id="pwConfirm" placeholder="再输一遍主密码" aria-label="再输一遍主密码" autocomplete="new-password" autocapitalize="off" spellcheck="false">
        </div>
        <input type="password" id="pwInput" placeholder="主密码" aria-label="主密码" autocomplete="current-password" autocapitalize="off" spellcheck="false">
        <div id="pwHint" class="pw-hint" hidden></div>
        <label class="remember-row">
          <input type="checkbox" id="rememberDevice" checked>
          <span>在此设备上记住(下次打开直接进入)</span>
        </label>
        <p class="remember-hint">钥匙存在本浏览器里:能打开这台电脑的人可直接看到笔记</p>
        <button id="pwBtn" class="btn primary block">解锁</button>
      </div>

      <div id="lockErr" class="lock-err" hidden></div>

      <p class="lock-hint">主密码不存储、不可找回;忘记 = 数据无法恢复</p>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="app" hidden>
    <header class="topbar">
      <button id="btnMenu" class="icon-btn menu-btn" title="打开菜单" aria-label="打开菜单" aria-expanded="false">☰</button>
      <div class="brand-mini">JMbiji</div>
      <div class="search-wrap">
        <input id="searchBox" type="search" placeholder="搜索标题与正文…(Ctrl+K)" aria-label="搜索标题与正文" autocomplete="off">
      </div>
      <span id="saveStatus" class="save-status" data-kind="ok">–</span>
      <button id="btnTheme" class="top-theme" title="切换为深色" aria-label="切换为深色">☾</button>
      <button id="btnLock" class="btn small" title="锁定并清除本机密钥" aria-label="锁定"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>锁定</button>
    </header>

    <div id="sideBackdrop" class="side-backdrop" hidden></div>
    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="side-sec">
          <div class="side-head">
            <span>分类</span>
            <button id="btnAddCat" class="icon-btn" title="新建分类" aria-label="新建分类">＋</button>
          </div>
          <ul id="catList" class="cat-list"></ul>
        </div>

        <div class="side-sec grow">
          <div class="side-head">
            <span id="activeCatName">未选择分类</span>
            <span class="side-head-btns">
              <button id="btnRenameCat" class="icon-btn" title="重命名分类(只改文件名)" aria-label="重命名分类">✎</button>
              <button id="btnAddNote" class="icon-btn primary" title="新建笔记" aria-label="新建笔记">＋</button>
            </span>
          </div>
          <ul id="noteList" class="note-list"></ul>
        </div>

        <div class="side-foot">
          <label class="foot-row">自动锁屏
            <select id="autoLock">
              <option value="0">关闭</option>
              <option value="5">5 分钟</option>
              <option value="15">15 分钟</option>
              <option value="30">30 分钟</option>
            </select>
          </label>
          <button id="btnTrash" class="btn ghost tiny block side-trash" title="查看最近删除的笔记(保留 30 天)">♻ 最近删除</button>
          <div class="foot-icons">
            <button id="btnChangePw" class="icon-btn foot-icon" title="修改主密码" aria-label="修改主密码"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></svg></button>
            <button id="btnExport" class="icon-btn foot-icon" title="导出全库备份" aria-label="导出全库备份"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="3" y2="15"/></svg></button>
            <button id="btnImport" class="icon-btn foot-icon" title="从备份恢复" aria-label="从备份恢复"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg></button>
            <button id="btnCleanBlobs" class="icon-btn foot-icon" title="清理未引用图片" aria-label="清理未引用图片"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg></button>
            <button id="btnDelCat" class="icon-btn foot-icon danger" title="删除当前分类(需二次确认,删除前自动备份)" aria-label="删除当前分类"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg></button>
          </div>
          <input id="importInput" type="file" accept=".zip,application/zip" hidden>
        </div>
      </aside>

      <main class="content">
        <div id="emptyState" class="empty">从左侧选择一个分类</div>

        <article id="readView" hidden>
          <div class="read-head">
            <h1 id="readTitle"></h1>
            <div class="read-actions">
              <button id="btnCopyAll" class="btn ghost small">⧉ 复制全文</button>
              <button id="btnExportMd" class="btn ghost small" title="下载为 .md 文件">.md</button>
              <button id="btnEdit" class="btn primary small">编辑</button>
              <button id="btnDelNote" class="btn ghost small danger">删除</button>
            </div>
          </div>
          <div id="readMeta" class="read-meta"></div>
          <div id="readBody" class="read-body"></div>
          <div id="readAtts" class="read-atts"></div>
        </article>

        <section id="editView" hidden>
          <input id="editTitle" class="edit-title" placeholder="标题" aria-label="笔记标题" autocomplete="off">
          <div class="ed-tools" id="edTools" role="toolbar" aria-label="Markdown 快捷插入">
            <button type="button" class="ed-btn" data-wrap="**" title="加粗" aria-label="加粗">B</button>
            <button type="button" class="ed-btn" data-wrap="*" title="斜体" aria-label="斜体">I</button>
            <button type="button" class="ed-btn" data-wrap="~~" title="删除线" aria-label="删除线">S</button>
            <span class="ed-sep" aria-hidden="true"></span>
            <button type="button" class="ed-btn" data-prefix="# " title="一级标题(大字)" aria-label="一级标题">H1</button>
            <button type="button" class="ed-btn" data-prefix="## " title="二级标题(中字)" aria-label="二级标题">H2</button>
            <button type="button" class="ed-btn" data-prefix="### " title="三级标题(小字)" aria-label="三级标题">H3</button>
            <span class="ed-sep" aria-hidden="true"></span>
            <button type="button" class="ed-btn" data-wrap="==" title="高亮" aria-label="高亮">H</button>
            <button type="button" class="ed-btn" data-wrap="`" title="行内代码" aria-label="行内代码">‹›</button>
            <button type="button" class="ed-btn" data-prefix="- " title="列表行" aria-label="列表行">≡</button>
            <span class="ed-sep" aria-hidden="true"></span>
            <button type="button" class="ed-btn" data-genpw title="随机密码生成器" aria-label="随机密码生成器">pw</button>
          </div>
          <textarea id="editBody" class="edit-body" spellcheck="false" aria-label="笔记正文"
            placeholder="正文…&#10;Markdown:# 标题 · **加粗** · *斜体* · ~~删除线~~ · ==高亮== · `代码` · - 列表"></textarea>
          <div class="edit-foot">
            <button id="btnAddAtt" class="btn ghost small">添加图片</button>
            <input id="attInput" type="file" accept="image/*" multiple hidden>
            <span class="edit-hint">Ctrl+S 或点「保存」立即上传;不操作也会在 5 分钟后自动保存</span>
            <button id="btnSaveNow" class="btn primary small">保存</button>
            <button id="btnDone" class="btn small">完成</button>
          </div>
          <div id="editAtts" class="edit-atts"></div>
        </section>
      </main>
    </div>

    <div id="searchPanel" class="search-panel" hidden></div>
  </div>

  <dialog id="modal" class="modal"><div id="modalBody"></div></dialog>
  <div id="toasts"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
