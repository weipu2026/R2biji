<!DOCTYPE html>
<html lang="zh-CN" data-controls="pwInput pwBtn pwConfirm btnLock btnMenu sideBackdrop btnAddCat btnRenameCat btnDelCat btnAddNote btnEdit readView btnDone btnSaveNow btnCopyAll btnDelNote btnHistory btnMono btnAddAtt attInput btnChangePw btnTrash btnExportMd readBody editTitle editBody searchBox btnTheme btnHelpKeys btnImport importInput rememberDevice btnSettings btnPrint">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="加密笔记 —— 端到端加密笔记本,多端云同步">
  <meta name="theme-color" content="#faf8f2">
  <title>加密笔记 · 端到端加密笔记本</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <!-- iOS「添加到主屏」不认 SVG favicon:没有 apple-touch-icon 时会拿页面截图当图标 -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 无 JS 回退:本应用是纯前端零依赖架构(所有加解密都在浏览器里),
       禁用 JS 时下面 #lock / #app 全是 hidden 状态,页面会是一片空白。
       用户只会以为「网站坏了」。这条 noscript 给出明确原因与出路。
       ⚠️ 样式一律写进 style.css(CSP 是 style-src 'self',内联 style 属性会被拦掉,
       在这里写 style="" 等于没写)。 -->
  <noscript>
    <div class="noscript-warn">
      <h1>需要启用 JavaScript</h1>
      <p>加密笔记的加解密全部在你自己的浏览器里完成(服务端只见密文),因此必须开启 JavaScript 才能使用。</p>
      <p class="noscript-hint">请在浏览器设置中允许本站运行 JavaScript 后刷新页面。</p>
    </div>
  </noscript>

  <!-- 锁屏 / 建库 -->
  <div id="lock" class="lock">
    <div class="lock-card">
      <div class="lock-brand">
        <img src="icon.svg" alt="" width="44" height="44">
        <div>
          <h1>加密笔记</h1>
          <p>加密笔记本 · 端到端加密 · 多端同步</p>
        </div>
      </div>

      <div id="lockForm" hidden>
        <div class="field" id="pwConfirmField" hidden>
          <input type="password" id="pwConfirm" placeholder="再输一遍主密码" aria-label="再输一遍主密码" autocomplete="new-password" autocapitalize="off" spellcheck="false">
        </div>
        <div class="pw-wrap"><input type="password" id="pwInput" placeholder="主密码" aria-label="主密码" autocomplete="current-password" autocapitalize="off" spellcheck="false"><button type="button" id="pwToggle" class="pw-toggle" title="显示密码" aria-label="显示密码"></button></div>
        <!-- aria-live:密码强度提示是「用户输入后才出现」的信息。锁屏是全应用最关键
             的入口,读屏用户听不到播报就等于没有提示(2026-10-18 审计 H2)。 -->
        <div id="pwHint" class="pw-hint" aria-live="polite" hidden></div>
        <label class="remember-row">
          <input type="checkbox" id="rememberDevice" checked>
          <span>在此设备上记住(下次打开直接进入)</span>
        </label>
        <p class="remember-hint">钥匙存在本浏览器里:能打开这台电脑的人可直接看到笔记</p>
        <button id="pwBtn" class="btn primary block">解锁</button>
      </div>

      <div id="lockLoading" class="lock-loading" role="status">
        <span class="spinner" aria-hidden="true"></span>
        <span>正在连接笔记库…</span>
      </div>

      <!-- role=alert:主密码输错 / 库不存在必须立刻播报,而不是只写一条红字在屏幕上 -->
      <div id="lockErr" class="lock-err" role="alert" hidden></div>

      <p class="lock-hint">主密码不存储、不可找回;忘记 = 数据无法恢复</p>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="app" hidden>
    <header class="topbar">
      <button id="btnMenu" class="icon-btn menu-btn" title="打开菜单" aria-label="打开菜单" aria-expanded="false"></button>
      <div class="brand-mini">加密笔记</div>
      <div class="search-wrap">
        <input id="searchBox" type="search" placeholder="搜索标题与正文…(Ctrl+K)" aria-label="搜索标题与正文" autocomplete="off">
      </div>
      <!-- 初始为空:以前这里放一个 en dash 字形做占位,与「图标/符号只走 SVG」的口径冲突。
         状态栏本身是定宽 96px,空着也不会让右侧按钮跳动。 -->
      <span id="saveStatus" class="save-status" data-kind="ok"></span>
      <button id="btnTheme" class="top-theme" title="切换为深色" aria-label="切换为深色"></button>
      <button id="btnLock" class="btn small" title="锁定并清除本机密钥" aria-label="锁定">锁定</button>
    </header>

    <div id="sideBackdrop" class="side-backdrop" hidden></div>
    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="side-sec">
          <div class="side-head">
            <span>分类</span>
            <button id="btnAddCat" class="icon-btn" title="新建分类" aria-label="新建分类"></button>
          </div>
          <ul id="catList" class="cat-list"></ul>
        </div>

        <div class="side-sec grow">
          <div class="side-head">
            <span id="activeCatName">未选择分类</span>
            <span class="side-head-btns">
              <button id="btnRenameCat" class="icon-btn" title="重命名分类(只改文件名)" aria-label="重命名分类"></button>
              <button id="btnAddNote" class="icon-btn primary" title="新建笔记" aria-label="新建笔记"></button>
            </span>
          </div>
          <ul id="noteList" class="note-list" title="J / K 切换上一条、下一条"></ul>
        </div>

        <div class="side-foot">
          <!-- 自动锁屏原在此处(一个裸 select)。2026-10-24 移入设置面板:
               * 设置项散落三处(顶栏主题 / 侧栏底 / 编辑态等宽)没有统一入口,
               * 新用户永远发现不了。现在统一收在左侧齿轮图标里。 -->
          <button id="btnTrash" class="btn ghost tiny block side-trash" title="查看最近删除的笔记(保留 30 天)">最近删除</button>
          <div class="foot-icons">
            <button id="btnSettings" class="icon-btn foot-icon" title="设置(主题 / 阅读排版 / 自动锁屏)" aria-label="设置"></button>
            <button id="btnChangePw" class="icon-btn foot-icon" title="修改主密码" aria-label="修改主密码"></button>
            <button id="btnExport" class="icon-btn foot-icon" title="导出全库备份" aria-label="导出全库备份"></button>
            <button id="btnImport" class="icon-btn foot-icon" title="从备份恢复(.zip)或导入 .md" aria-label="从备份恢复或导入 Markdown"></button>
            <!-- 键盘快捷键清单。已有 9 个快捷键但此前没有任何地方集中展示,新用户全靠试;
                 桌面端再给一个 ? 的全局入口(见 shell.js)。 -->
            <button id="btnHelpKeys" class="icon-btn foot-icon" title="键盘快捷键(按 ? 也可以)" aria-label="键盘快捷键"></button>
            <button id="btnCleanBlobs" class="icon-btn foot-icon" title="清理未引用图片" aria-label="清理未引用图片"></button>
            <button id="btnDelCat" class="icon-btn foot-icon danger" title="删除当前分类(需二次确认,删除前自动备份)" aria-label="删除当前分类"></button>
          </div>
          <!-- accept 同时收 .zip 与 .md/.txt:zip 走「从备份恢复」,md/txt 走「批量导入」
             (按扩展名在 change 里分流,见 shell.js)。图标由 shell.js 注入。 -->
          <input id="importInput" type="file" accept=".zip,.md,.markdown,.txt,application/zip,text/markdown,text/plain" multiple hidden>
        </div>
      </aside>

      <main class="content">
        <div id="emptyState" class="empty">正在载入…</div>

        <article id="readView" hidden>
          <div class="read-head">
            <h1 id="readTitle"></h1>
            <div class="read-actions">
              <button id="btnCopyAll" class="btn ghost small">复制全文</button>
              <button id="btnExportMd" class="btn ghost small" title="下载为 .md 文件">.md</button>
              <button id="btnHistory" class="btn ghost small" title="查看本笔记的历史版本(每次保存自动留档)">历史</button>
              <button id="btnPrint" class="btn ghost small" title="打印或存为 PDF(只输出标题与正文,不带界面)">打印</button>
              <button id="btnEdit" class="btn primary small">编辑</button>
              <button id="btnDelNote" class="btn ghost small danger">删除</button>
            </div>
          </div>
          <div id="readMeta" class="read-meta"></div>
          <div id="readBody" class="read-body"></div>
          <div id="readAtts" class="read-atts"></div>
        </article>

        <section id="editView" hidden>
          <input id="editTitle" class="edit-title" placeholder="标题" aria-label="笔记标题" autocomplete="off">
          <div class="ed-tools" id="edTools" role="toolbar" aria-label="Markdown 快捷插入">
            <button type="button" class="ed-btn" data-wrap="**" title="加粗" aria-label="加粗">B</button>
            <button type="button" class="ed-btn" data-wrap="*" title="斜体" aria-label="斜体">I</button>
            <button type="button" class="ed-btn" data-wrap="~~" title="删除线" aria-label="删除线">S</button>
            <span class="ed-sep" aria-hidden="true"></span>
            <button type="button" class="ed-btn" data-prefix="# " title="一级标题(大字)" aria-label="一级标题">H1</button>
            <button type="button" class="ed-btn" data-prefix="## " title="二级标题(中字)" aria-label="二级标题">H2</button>
            <button type="button" class="ed-btn" data-prefix="### " title="三级标题(小字)" aria-label="三级标题">H3</button>
            <span class="ed-sep" aria-hidden="true"></span>
            <button type="button" class="ed-btn" data-wrap="==" title="高亮" aria-label="高亮">H</button>
            <!-- 图标由 shell.js 用 ICON.code / ICON.list 注入(HTML 里零 <svg>、零 Unicode 装饰符) -->
            <button type="button" class="ed-btn" data-wrap="`" title="行内代码" aria-label="行内代码"></button>
            <button type="button" class="ed-btn" data-prefix="- " title="列表行" aria-label="列表行"></button>
            <span class="ed-sep" aria-hidden="true"></span>
            <button type="button" class="ed-btn" data-genpw title="随机密码生成器" aria-label="随机密码生成器">pw</button>
          </div>
          <textarea id="editBody" class="edit-body" spellcheck="false" aria-label="笔记正文"
            placeholder="正文…&#10;Markdown:# 标题 · **加粗** · *斜体* · ~~删除线~~ · ==高亮== · `代码` · - 列表"></textarea>
          <div class="edit-foot">
            <button id="btnMono" class="btn ghost small" aria-pressed="false" title="编辑器切换等宽字体(记住偏好)">等宽</button>
            <button id="btnAddAtt" class="btn ghost small" title="可选任意文件;图片也可以直接 Ctrl+V 粘贴到正文区">添加附件</button>
            <input id="attInput" type="file" multiple hidden>
            <span id="editCount" class="edit-count" title="正文字数(不含空白)"></span>
            <span class="edit-hint">Ctrl+S 保存(停笔 4 秒也会自动存);图片可直接 Ctrl+V 粘贴</span>
            <button id="btnSaveNow" class="btn primary small">保存</button>
            <button id="btnDone" class="btn small">完成</button>
          </div>
          <div id="editAtts" class="edit-atts"></div>
        </section>
      </main>
    </div>

    <!-- aria-live=polite:搜索结果条数是「用户输入后才出现」的信息,读屏器需要它播报。
         #toasts 有、这里原先漏了 —— 键盘/读屏用户按 Ctrl+K 后听不到「N 条匹配」。 -->
    <div id="searchPanel" class="search-panel" aria-live="polite" aria-atomic="true" hidden></div>

    <!-- 页面级拖拽导入的放置提示(2026-10-24 B1):dragover 时显示、drop /
         dragleave(离开窗口)时隐藏。pointer-events:none —— 它只是视觉提示,
         真正的放置目标是 document(见 shell.js 的三条 window 监听)。 -->
    <div id="dropVeil" class="drop-veil" hidden>
      <div class="drop-card">
        <div class="drop-title">松手导入</div>
        <div class="drop-sub">.zip 备份包 · .md / .txt 文本(可多选,按扩展名自动分流)</div>
      </div>
    </div>
  </div>

  <dialog id="modal" class="modal"><div id="modalBody"></div></dialog>
  <!-- toast 是异步状态提示(保存失败 / 清理中止 / 覆盖未生效):不给 aria-live 的话
       读屏用户完全听不到任何反馈(2026-09-29 审计 P3) -->
  <div id="toasts" aria-live="polite" aria-atomic="false"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
