# JMbiji 部署配置(**模板**,只有合法默认值,不含任何人的真实域名/密钥)
#
# 这是给 scripts/gen-config.mjs 读的模板:部署前把环境变量注入进来,
# 产出真正用于部署的 wrangler.deploy.toml(已 gitignore)。
# 直接 `npx wrangler deploy` 也能跑(用下面的默认值),但推荐走 `npm run deploy`。
#
# 部署:
#   npx wrangler login 后
#   npx wrangler secret put ACCESS_KEY   ← 必做,否则接口一律 503(fail closed)
#   npx wrangler deploy                  ← R2 桶无需手动创建,首次部署按 bucket_name 自动预配
#
# ⚠️ 不要用 [vars] 放 ACCESS_KEY:vars 是明文配置,密钥请一律走 secret。

name = "jmbiji"
main = "worker/worker.js"
compatibility_date = "2025-09-15"

# <name>.<子域>.workers.dev 入口开关(默认保留 = true)。
# 它是「首次绑自定义域、DNS 还没生效」时的验收兜底:CI 会自动退回这个入口完成门禁校验
# (两个入口指向同一个 Worker)。地址虽可被猜到,但 /api/* 全被 ACCESS_KEY 拦住。
# 确实只要自定义域一个入口 → 部署时设 HIDE_WORKERS_DEV=1(gen-config 会把这里改成 false)。
workers_dev = true

# 数据桶:存放 vault.json / 分类密文 / 附件密文 / 备份
# bucket_name 可被环境变量 BUCKET_NAME 覆盖(gen-config 注入)。
# ⛔ 桶必须保持**私有**:不开 r2.dev 公开域、不绑自定义域、不启用 Public Access。
#    本应用所有读写都走 Worker,桶从不需要对外可达;一旦公开,全部密文可被任何人下载,
#    且 ACCESS_KEY 这道门(只拦 /api/*)会被整体绕过。详见 README「安装部署」。
[[r2_buckets]]
binding = "VAULT"
bucket_name = "jmbiji-vault"

# 静态前端(public/ 目录);命中静态文件由平台直接返回,其余路径进 Worker
# 安全响应头在 public/_headers 里(注意:该文件不作用于 Worker 生成的 /api/* 响应)
[assets]
directory = "./public"

# 自定义域名路由由 gen-config 插入在这里(配了 WORKER_DOMAIN 时才启用)。
# gen:routes

# 访问密钥门(所有 /api/* 共用,≥16 个 ASCII 字符)。
# 设置:npx wrangler secret put ACCESS_KEY
# 未设置或过短 → 服务端拒绝全部请求(503),防止 URL 泄露者拉走 vault.json 离线爆破主密码。
#
# 只在「我清楚风险、就是要一个纯网址+主密码的库」时才打开下面这个开关(强烈不推荐):
# [vars]
# ALLOW_NO_ACCESS_KEY = "1"
